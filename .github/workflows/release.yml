name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --locked

      - name: package
        run: |
          name="lport-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "$name/assets"
          cp target/release/lport install.sh README.md "$name/"
          cp assets/lport.desktop assets/lport-autostart.desktop "$name/assets/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            lport-*.tar.gz
            lport-*.tar.gz.sha256
